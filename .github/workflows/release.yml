name: Release

# Tag a commit on main with v<semver> (e.g. v0.1.0) and push the tag:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds the release binary and publishes a GitHub Release with the
# single exe attached — the exe IS the app (no installer, no store).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/justquery.exe
          generate_release_notes: true
