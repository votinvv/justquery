name: Publish to winget

# Fires after a GitHub Release is published (by release.yml). Generates an
# updated winget manifest and opens a PR against microsoft/winget-pkgs.
#
# PREREQUISITES (one-time):
#   1. Fork https://github.com/microsoft/winget-pkgs under the votinvv account.
#   2. Create a classic Personal Access Token with the `public_repo` scope.
#   3. Add it to this repo as a secret named WINGET_TOKEN
#      (Settings -> Secrets and variables -> Actions).
#   4. The package votinvv.JustQuery must already exist in winget-pkgs — submit
#      the FIRST version manually once (see README / publish notes), then every
#      later release is automated by this workflow.

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: votinvv.JustQuery
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
