[package]
name = "justquery"
version = "0.4.0"
edition = "2021"
description = "JustQuery — a minimalist PostgreSQL IDE with an XML mode"
authors = ["votinvv <votin88@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/votinvv/justquery"
homepage = "https://github.com/votinvv/justquery"
readme = "README.md"
keywords = ["postgresql", "database", "ide", "sql", "egui"]
categories = ["database"]

[dependencies]
# wgpu backend (DirectX 12 / Vulkan on Windows, WARP software fallback) — replaced glow (OpenGL)
# after a customer machine with no OpenGL-capable driver (bare VM) died silently on launch:
# DX12 + WARP exist on every Windows 10+ install, OpenGL 3.x does not.
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
native-tls = "0.2.18"
postgres = "0.19.13"
postgres-native-tls = "0.5.3"
# HTTP client for the in-app GitHub update check / download. native-tls feature reuses the TLS
# stack already in the tree (no second rustls); default-features off keeps the dep tree small.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Document core (src/doc/): memory-mapped origin buffer + encoding detection.
memmap2 = "0.9"
encoding_rs = "0.8"
memchr = "2"
# XML mode: a streaming parser for the formatter/validator,
# regex — for XSD pattern facets, serde_json — the validation-rule registry,
# sha2 — the checksum of XML models (.jqmodel).
quick-xml = "0.40"
regex = "1"
serde_json = "1"
# 0.11 (not 0.10) to MATCH the sha2 pulled in by postgres-protocol — otherwise the tree has two
# parallel sha2 versions (0.10 ours + 0.11 transitive). The `Digest` API (new/update/finalize) is identical.
sha2 = "0.11"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
