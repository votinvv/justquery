[package]
name = "justquery"
version = "0.3.1"
edition = "2021"
description = "JustQuery — a minimalist PostgreSQL IDE"
authors = ["votinvv <votin88@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/votinvv/justquery"
homepage = "https://github.com/votinvv/justquery"
readme = "README.md"
keywords = ["postgresql", "database", "ide", "sql", "egui"]
categories = ["database"]

[dependencies]
# wgpu backend (DirectX 12 / Vulkan on Windows, WARP software fallback) — replaced glow (OpenGL)
# after a customer machine with no OpenGL-capable driver (bare VM) died silently on launch:
# DX12 + WARP exist on every Windows 10+ install, OpenGL 3.x does not.
eframe = { version = "0.34", default-features = false, features = ["wgpu", "default_fonts"] }
native-tls = "0.2.18"
postgres = "0.19.13"
postgres-native-tls = "0.5.3"
# HTTP client for the in-app GitHub update check / download. native-tls feature reuses the TLS
# stack already in the tree (no second rustls); default-features off keeps the dep tree small.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
